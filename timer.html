<!DOCTYPE html>
<html>

<head>
    <title>Demo Jellyfish</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">

    <link rel="stylesheet" href="./assets/css/style.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container">
        <a class="btn btn-info" href="index.html">Back</a>
        <div class="myAlert-top alert alert-info">
            <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>
            <strong id="alertText"></strong>
        </div>
        <br />
        <div class="container" id="mainPage">
            <div class="row">
                <div class="col-md-10 col-md-offset-1">
                    <div class="jumbotron">
                        <h2>View Timer <button type="button" class="btn btn-info pull-right"
                                onclick="openTimerModal()">+</button></h2>
                        <table class="table table-hover" id="timerData">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Author</th>
                                    <th>Task</th>
                                    <th>Total</th>
                                    <th>Current</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Author Modal Starts-->
    <div class="modal fade" id="timerModal" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title">Timer</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Timer Name:</label>

                        <input type="hidden" id="timerId">
                        <input type="hidden" id="rowId">
                        <input type="text" class="form-control" id="timerName" placeholder="Enter Name">
                    </div>
                    <div class="form-group">
                        <label>Author:</label>
                        <select id="authId"  class="form-control" ></select>
                    </div>
                    <div class="form-group">
                        <label>Task:</label>
                        <select id="taskId"  class="form-control" ></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" id="addTimer" onclick="addTimer()">Save</button>
                    <button type="button" class="btn btn-success" id="editTimer" onclick="editTimer()">Update</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Author Modal Ends-->
    
</body>


<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="./assets/js/custom.js"></script>

</html>
